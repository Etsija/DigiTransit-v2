# Finland GTFS schema exposes vehicleMode on Stop; route.mode remains the fallback for multimode stops.
query StopsNearbyQuery($lat: Float!, $lon: Float!, $radius: Int!) {
  stopsByRadius(lat: $lat, lon: $lon, radius: $radius) {
    edges {
      node {
        distance
        stop {
          gtfsId
          name
          code
          zoneId
          lat
          lon
          vehicleMode
          parentStation {
            name
          }
          patterns {
            directionId
            route {
              shortName
              longName
              mode
            }
            stops {
              gtfsId
              code
              name
            }
          }
        }
      }
    }
  }
}
